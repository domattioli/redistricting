function nearSeed(pt) { let b = null, bv = (18 * pt.k) ** 2; SIM.seeds.forEach(x => { const v = (G.cx[x.d] - pt.x) ** 2 + (G.cy[x.d] - pt.y) ** 2; if (v < bv) { bv = v; b = x; } }); return b; }
function snap() { (SIM.hist || (SIM.hist = [])).push({ seeds: SIM.seeds.map(x => Object.assign({}, x)), next: SIM.next }); }
function say(t) { $('hover').textContent = t; }
function wireSim() {
  for (const m of ['look', 'move', 'add', 'remove']) $('m-' + m).onclick = () => { S.mode = m; press(['m-look', 'm-move', 'm-add', 'm-remove'], 'm-' + m); $('stage').dataset.mode = m; if (m !== 'look' && !ST.sim) run(); };
  $('run').onclick = run;
  $('undo').onclick = () => { const h = SIM.hist && SIM.hist.pop(); if (!h) return say('nothing to undo'); SIM.seeds = h.seeds; SIM.next = h.next; if (!SIM.seeds.some(x => x.s === S.hi)) S.hi = -1; say('last seed change undone'); run(); };
  $('reset').onclick = () => { cancelAnimationFrame(SIM.timer); SIM.seeds = DEFAULT.map(x => Object.assign({}, x)); SIM.next = NS0; SIM.hist = []; ST.sim = false; ST.names.length = ST.abbrs.length = ST.colors.length = NS0;
    dnew = Int16Array.from(R.district_new); paint(); ST.labels = R.labels; ST.rows = R.rows.map((r, s) => Object.assign({ s }, r)); S.hi = -1;
    $('total').textContent = `${R.retained_total_pct.toFixed(1)}% of Americans live in the new state that carries their state's name. Click a row or the map to highlight a state.`; table(); render(); };
  $('seeds').onchange = render;
  const cv = $('map');
  cv.addEventListener('contextmenu', e => { if (S.mode !== 'look') e.preventDefault(); });
  cv.addEventListener('pointerdown', e => { if (e.button === 2 && S.mode === 'add') { S.mode = 'remove'; SIM.back = 'add'; return; } if (S.mode !== 'move') return; const sd = nearSeed(at(e)); if (sd) { SIM.drag = sd; cv.setPointerCapture(e.pointerId); say(`moving the ${ST.names[sd.s]} seed`); } });
  cv.addEventListener('pointerup', e => {
    const pt = at(e); if (pt.p < 0) { SIM.drag = null; return; } const d = dist[pt.p];
    if (S.mode === 'move' && SIM.drag) { const sd = SIM.drag; SIM.drag = null; if (d < 0) return; if (SIM.seeds.some(x => x.d === d && x !== sd)) return say('another seed is in that district'); snap(); sd.d = d; run(); return; }
    if (S.mode === 'add') { if (d < 0) return; if (SIM.seeds.some(x => x.d === d)) return say('a seed is already in that district'); const host = SIM.seeds.find(x => x.s === dnew[d]);
      if (!host || host.seats < 2) return say('this state has 1 seat; it cannot give one away');
      snap(); const s = SIM.next++, give = Math.floor(host.seats / 2); host.seats -= give; ST.names[s] = 'New state ' + (s - NS0 + 1); ST.abbrs[s] = 'N' + (s - NS0 + 1); ST.colors[s] = newColor(dnew[d]);
      SIM.seeds.push({ s, d, seats: give }); say(`${ST.names[s]} takes ${give} of ${ST.names[host.s]}'s seats`); run(); return; }
    if (S.mode === 'remove') { if (SIM.back) { S.mode = SIM.back; SIM.back = null; } if (d < 0) return; if (SIM.seeds.length < 2) return; const s = dnew[d], i = SIM.seeds.findIndex(x => x.s === s); if (i < 0) return;
      const votes = new Map(); for (let a = 0; a < ND; a++) if (dnew[a] === s) G.nb[a].forEach(b => { if (dnew[b] !== s) votes.set(dnew[b], (votes.get(dnew[b]) || 0) + 1); });
      const heir = [...votes].sort((a, b) => b[1] - a[1])[0]; const h = heir && SIM.seeds.find(x => x.s === heir[0]); if (!h) return;
      snap(); h.seats += SIM.seeds[i].seats; say(`${ST.names[s]} removed; ${ST.names[h.s]} takes its ${SIM.seeds[i].seats} seats`); SIM.seeds.splice(i, 1); if (S.hi === s) S.hi = -1; run(); }
  });
}

wire(); wireSim(); table(); render(); window.__ready = true;
</script>
